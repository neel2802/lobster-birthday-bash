<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Three Little Levels</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600;700&family=Shrikhand&display=swap">
<style>
/* Layout: one framed 4:5 game window centered on a soft scene backdrop, HUD above, instruction pill below. */
:root{
  --ink:#2a2140; --ink-soft:#5d5374; --paper:#fffaf2; --glass:rgba(255,252,247,.86); --line:rgba(42,33,64,.12);
  --petal:#f78fb3; --blue:#2f6fe0; --leaf:#4f9a68; --gold:#f5b83d; --mint:#8fd3c1; --night:#16122b; --berry:#e2557a; --white:#ffffff;
  --font-display:'Shrikhand', Georgia, 'Times New Roman', serif;
  --font-body:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --font-hand:'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--night); color:var(--ink); font-family:var(--font-body); overflow:hidden; -webkit-tap-highlight-color:transparent}
button{font-family:inherit; color:inherit}

/* backdrops */
.bgs{position:fixed; inset:0; z-index:0}
.bg{position:absolute; inset:0; opacity:0; transition:opacity 1.4s ease}
.bg.on{opacity:1}
.bg[data-bg="intro"]{background:radial-gradient(55% 55% at 18% 20%, #ffd3e0 0, transparent 70%), radial-gradient(45% 50% at 85% 25%, #ffe3b3 0, transparent 70%), radial-gradient(60% 55% at 60% 95%, #cfe9ff 0, transparent 70%), #fbeff2}
.bg[data-bg="garden"]{background:radial-gradient(55% 55% at 15% 25%, #d3f1dc 0, transparent 70%), radial-gradient(50% 50% at 90% 15%, #ffe0c9 0, transparent 70%), radial-gradient(60% 60% at 50% 100%, #c9ecd6 0, transparent 70%), #f0f8f1}
.bg[data-bg="kitchen"]{background:radial-gradient(55% 55% at 15% 20%, #fff0c2 0, transparent 70%), radial-gradient(50% 50% at 90% 70%, #ffd0d8 0, transparent 70%), #fff5e2}
.bg[data-bg="box"]{background:radial-gradient(60% 50% at 20% 15%, #3d3478 0, transparent 70%), radial-gradient(50% 50% at 85% 85%, #6b3f74 0, transparent 70%), #1a1736}
.bg[data-bg="finale"]{background:radial-gradient(50% 40% at 50% 60%, #2a1f4a 0, transparent 70%), #0d0b1c}

.app{position:relative; z-index:1; height:100%; max-width:1000px; margin:0 auto; display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:12px 14px; box-sizing:border-box}

.hud{display:flex; align-items:center; justify-content:space-between; gap:12px}
.levels{display:flex; gap:6px; list-style:none; padding:0; margin:0; flex-wrap:wrap}
.levels li{font-size:13px; font-weight:600; letter-spacing:.02em; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.4); color:rgba(42,33,64,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:all .4s}
.levels li.now{background:var(--white); color:var(--ink); box-shadow:0 6px 18px -8px rgba(42,33,64,.45)}
.levels li.done{background:rgba(255,255,255,.7); color:var(--ink)}
.levels li.done::before{content:"✓ "; color:var(--leaf)}
.pill-btn{border:none; cursor:pointer; font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px; background:rgba(255,255,255,.55); color:var(--ink); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
body.dark .levels li{background:rgba(255,255,255,.14); color:rgba(255,255,255,.72)}
body.dark .levels li.now{background:var(--white); color:var(--ink)}
body.dark .levels li.done{background:rgba(255,255,255,.24); color:var(--white)}
body.dark .pill-btn{background:rgba(255,255,255,.16); color:var(--white)}
#nextBtn{background:var(--berry)}
.pill-btn:focus-visible,.btn:focus-visible,.lock:focus-visible,.opt:focus-visible,.key:focus-visible,.tile:focus-visible,.card:focus-visible{outline:3px solid var(--gold); outline-offset:3px}

.stage{position:relative; min-height:0}
.screen{position:absolute; inset:0; display:grid; place-items:center; opacity:0; visibility:hidden; transform:scale(.97); transition:opacity .6s ease, transform .6s ease, visibility 0s linear .6s}
.screen.active{opacity:1; visibility:visible; transform:none; transition:opacity .6s ease, transform .6s ease}
.scene{position:relative; height:min(100%, 680px, calc((100vw - 32px) * 1.25)); aspect-ratio:4/5; max-width:100%; border-radius:28px; overflow:hidden;
  box-shadow:0 30px 70px -24px rgba(30,20,60,.5), inset 0 0 0 1px rgba(255,255,255,.35); background:var(--paper); touch-action:none; user-select:none; -webkit-user-select:none}
.scene > svg{display:block; width:100%; height:100%}

.hint{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px; min-height:48px}
#say{margin:0; font-size:clamp(15px, 2.1vw, 18px); font-weight:500; line-height:1.35; text-align:center; text-wrap:balance; background:var(--glass); color:var(--ink); padding:10px 18px; border-radius:16px; max-width:min(560px, 100%); box-shadow:0 10px 30px -14px rgba(30,20,60,.45)}
#say:empty{display:none}
#say.in{animation:sayIn .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes sayIn{from{transform:translateY(6px) scale(.97); opacity:.2}}

.btn{border:none; cursor:pointer; font:600 16px var(--font-body); padding:12px 24px; border-radius:999px; background:var(--ink); color:var(--white); box-shadow:0 10px 24px -10px rgba(42,33,64,.6); transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.light{background:var(--white); color:var(--ink)}
.btn.ghost{background:transparent; color:var(--ink-soft); box-shadow:none}

/* intro */
.intro{background:linear-gradient(160deg, #e3efff 0%, #fff6dc 55%, #dcecff 100%); display:grid; place-items:center}
.intro-in{position:relative; z-index:2; text-align:center; padding:28px; display:flex; flex-direction:column; align-items:center; gap:10px}
.intro h1{font:400 clamp(44px, 9vw, 72px)/1 var(--font-display); margin:0 0 6px; color:var(--blue); text-wrap:balance}
.intro p{margin:0; font-size:18px; color:var(--ink); max-width:30ch}
.intro p.soft{font-size:14px; color:var(--ink-soft); margin-bottom:12px}
.fp{position:absolute; top:-8%; width:14px; height:18px; border-radius:60% 10% 60% 10%; opacity:.8; animation:fall linear infinite}
@keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}

/* svg motion */
.grow{transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.fade{transition:opacity 1.1s ease}
.slide{transition:transform 1s cubic-bezier(.22,1,.36,1)}
.petal{transition:transform .6s cubic-bezier(.34,1.56,.64,1), opacity .4s}
.petal.tap{cursor:pointer}
.petal.read{opacity:.72}
#gStem{transition:stroke-dashoffset .35s linear}
.cloud .cl-in{transition:transform 1.3s cubic-bezier(.22,1,.36,1), opacity 1s}
#gClouds.live .cloud{cursor:pointer}
.drift{animation:drift 40s linear infinite alternate}
@keyframes drift{to{transform:translateX(90px)}}
.flick{animation:flick 1.1s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1)} 25%{transform:scale(.9,1.1) translateX(.4px)} 50%{transform:scale(1.06,.94) translateX(-.4px)} 75%{transform:scale(.95,1.06)}}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25}}
.shake{animation:shake .45s ease-in-out 2}
@keyframes shake{25%{transform:translateX(-5px) rotate(-1.5deg)} 75%{transform:translateX(5px) rotate(1.5deg)}}
.lidfly{transition:transform 1.1s cubic-bezier(.22,1,.36,1), opacity 1.1s}
.spin{animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* kitchen */
.bubbles{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.bub{position:absolute; width:68px; height:68px; margin-left:-34px; border-radius:50%; border:none; padding:0; cursor:pointer; pointer-events:auto;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 10%, rgba(255,255,255,.35) 30%, rgba(180,230,255,.25) 70%, rgba(255,255,255,.6) 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.8), 0 8px 20px -8px rgba(80,60,120,.35); display:grid; place-items:center; font-size:32px}
.bub span{animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px) rotate(6deg)}}
.amb{position:absolute; bottom:-30px; border-radius:50%; background:rgba(255,255,255,.5); box-shadow:inset 0 0 0 1px rgba(255,255,255,.8); animation:ambUp linear infinite}
@keyframes ambUp{to{transform:translateY(-140%) translateY(-600px)}}
.ktoast{position:absolute; top:14px; left:14px; right:14px; display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:18px; background:var(--glass);
  box-shadow:0 12px 30px -14px rgba(60,40,80,.45); transform:translateY(-140%); transition:transform .5s cubic-bezier(.34,1.56,.64,1); pointer-events:none}
.ktoast.show{transform:none}
.ktoast .tk-ico{font-size:30px}
.ktoast p{margin:0; font-size:15px; line-height:1.3; color:var(--ink); min-width:0}
.ktoast b{font-weight:700}

/* box */
.lock{position:absolute; width:54px; height:54px; transform:translate(-50%,-50%); border:none; border-radius:50%; cursor:pointer; padding:0;
  background:radial-gradient(circle at 35% 30%, #fff8dc, #f5b83d 70%); color:#7a4b0c; box-shadow:0 8px 18px -6px rgba(0,0,0,.5), inset 0 -3px 0 rgba(0,0,0,.12);
  display:grid; place-items:center; transition:transform .3s}
.lock:hover{transform:translate(-50%,-50%) scale(1.08)}
.lock svg{width:26px; height:30px; overflow:visible}
.lock .shackle{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.lock .num{position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; background:var(--ink); color:var(--white); font-size:12px; font-weight:700; display:grid; place-items:center}
.lock.open .shackle{transform:translateY(-6px)}
.lock.gone{animation:lockDrop .9s .35s cubic-bezier(.55,0,.75,.2) forwards; pointer-events:none}
@keyframes lockDrop{to{transform:translate(-50%, 160px) rotate(40deg); opacity:0}}

/* modal */
.modal{position:fixed; inset:0; z-index:60; display:grid; place-items:center; background:rgba(22,18,43,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:16px; opacity:0; transition:opacity .25s}
.modal.show{opacity:1}
.sheet{width:min(440px, 100%); max-height:100%; overflow:auto; box-sizing:border-box; background:var(--paper); border-radius:24px; padding:22px; box-shadow:0 30px 60px -20px rgba(0,0,0,.5); transform:translateY(14px) scale(.98); transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.modal.show .sheet{transform:none}
.m-kicker{margin:0; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--berry)}
.m-title{margin:2px 0 14px; font:400 30px/1.1 var(--font-display); color:var(--ink)}
.m-foot{display:flex; justify-content:center; margin-top:14px}
.qmeta{margin:0 0 4px; font-size:13px; color:var(--ink-soft)}
.qtext{margin:0 0 14px; font-size:19px; font-weight:600; line-height:1.3}
.opts{display:flex; flex-direction:column; gap:8px}
.opt{text-align:left; padding:13px 16px; border-radius:14px; border:2px solid var(--line); background:var(--white); font-size:16px; font-weight:500; cursor:pointer; transition:background .2s, border-color .2s}
.opt:hover:not(:disabled){border-color:rgba(42,33,64,.3)}
.opt.right{border-color:var(--leaf); background:#e6f5eb}
.opt.wrong{border-color:var(--berry); background:#fdecef; animation:shake .35s}
.qmsg{min-height:1.4em; margin:10px 0 0; font-size:14px; color:var(--berry); font-weight:500}
.hintline{margin:-6px 0 14px; font-size:14px; color:var(--ink-soft)}

.puzzle{position:relative; width:min(300px, 100%); aspect-ratio:1; max-width:100%; margin:0 auto; border-radius:16px; overflow:hidden; background:#ece6f3}
.tile{position:absolute; width:33.333%; height:33.333%; padding:0; border:2px solid var(--paper); border-radius:10px; box-sizing:border-box; background-size:300% 300%; cursor:pointer; transition:left .18s ease, top .18s ease}
.puzzle .peek{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .4s; pointer-events:none}
.puzzle.peeking .peek,.puzzle.solved .peek{opacity:1}
.prow{display:flex; justify-content:center; gap:8px; margin-top:12px}

.cards{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px}
.card{aspect-ratio:3/4; perspective:600px; border:none; background:none; padding:0; cursor:pointer}
.card .in{position:relative; display:block; width:100%; height:100%; transition:transform .45s; transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute; inset:0; border-radius:12px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4px; box-sizing:border-box}
.face.back{background:linear-gradient(135deg, #2f6fe0, #7fb8ff); color:var(--white); font:400 26px var(--font-display)}
.face.front{background:var(--white); border:2px solid var(--line); transform:rotateY(180deg); font-size:12px; line-height:1.15; font-weight:500}
.face.front b{font-size:24px; margin-bottom:4px}
.card.matched .face.front{border-color:var(--gold); background:#fff6dc}

.slots{display:flex; justify-content:center; gap:10px; margin-bottom:16px}
.slot{width:50px; height:60px; border-radius:14px; background:var(--white); border:2px solid var(--line); font:600 28px var(--font-body); display:grid; place-items:center; font-variant-numeric:tabular-nums}
.slots.bad{animation:shake .35s}
.slots.ok .slot{border-color:var(--leaf); background:#e6f5eb}
.keys{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; max-width:270px; margin:0 auto}
.key{padding:13px 0; border-radius:14px; border:none; background:var(--white); box-shadow:0 2px 0 rgba(42,33,64,.15); font:600 20px var(--font-body); cursor:pointer}
.key:active{transform:translateY(2px); box-shadow:none}

/* notes */
.note{position:fixed; inset:0; z-index:58; display:grid; place-items:center; background:rgba(40,30,50,.35); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:16px}
.paper{position:relative; width:min(360px, 100%); box-sizing:border-box; padding:28px 26px 20px; border-radius:6px; transform:rotate(-1.5deg);
  background:repeating-linear-gradient(#fffdf6 0 33px, #e9e2f2 33px 34px); box-shadow:0 24px 50px -18px rgba(0,0,0,.45); animation:noteIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes noteIn{from{transform:rotate(-6deg) scale(.8); opacity:0}}
.paper p{margin:0; font:700 30px/1.12 var(--font-hand); color:var(--ink)}
.paper .tape{position:absolute; top:-12px; left:50%; width:90px; height:24px; margin-left:-45px; background:rgba(127,184,255,.6); transform:rotate(3deg)}
.paper .btn{margin-top:18px}

/* level card */
.levelcard{position:fixed; inset:0; z-index:55; display:grid; place-items:center; background:rgba(255,250,242,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); animation:fadeIn .4s}
.levelcard.dark{background:rgba(20,16,40,.5)}
.levelcard.out{animation:fadeOut .45s forwards}
@keyframes fadeIn{from{opacity:0}} @keyframes fadeOut{to{opacity:0}}
.lc-in{text-align:center; animation:lcIn .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes lcIn{from{transform:scale(.6); opacity:0}}
.lc-num{margin:0; font-size:14px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--berry)}
.lc-title{margin:4px 0; font:400 clamp(48px, 10vw, 84px)/1 var(--font-display); color:var(--ink)}
.levelcard.dark .lc-title{color:var(--white)}
.lc-sub{margin:0; font-size:18px; color:var(--ink-soft)}
.levelcard.dark .lc-sub{color:rgba(255,255,255,.8)}

/* finale */
.blackout{position:fixed; inset:0; z-index:48; background:#000; opacity:0; pointer-events:none; transition:opacity .8s}
.blackout.on{opacity:1; pointer-events:auto}
.party{position:fixed; inset:0; z-index:50; overflow:hidden; opacity:0; transition:opacity 1s}
.party.on{opacity:1}
.party-bg{position:absolute; inset:0; background:linear-gradient(125deg, #4f8cff, #8fc4ff, #ffd36b, #6f9dff, #4f8cff); background-size:400% 400%; animation:shift 16s ease-in-out infinite alternate}
@keyframes shift{to{background-position:100% 50%}}
.balloons{position:absolute; inset:0}
.balloon{position:absolute; bottom:-180px; border:none; background:none; padding:0; cursor:pointer; animation:rise var(--dur, 11s) linear both}
.balloon .sway{display:block; animation:sway 3s ease-in-out infinite alternate}
.balloon svg{display:block; width:100%; height:auto; overflow:visible; filter:drop-shadow(0 8px 10px rgba(80,30,80,.18))}
@keyframes rise{to{transform:translateY(calc(-100vh - 260px))}}
@keyframes sway{from{transform:translateX(-12px) rotate(-4deg)} to{transform:translateX(12px) rotate(4deg)}}
.hb{position:absolute; left:0; right:0; top:calc(9% + env(safe-area-inset-top, 0px)); text-align:center; pointer-events:none; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.hb p{margin:0}
.hb-1{font:400 clamp(38px, 8vw, 86px)/1.05 var(--font-display); color:var(--white); text-shadow:0 4px 0 rgba(150,40,90,.35), 0 14px 34px rgba(80,20,60,.25)}
.hb-1 .ch{display:inline-block; animation:popIn .65s cubic-bezier(.34,1.7,.64,1) both; animation-delay:calc(var(--i) * 55ms + .5s)}
@keyframes popIn{from{transform:translateY(40px) scale(.2) rotate(-12deg); opacity:0}}
.hb-25{font:400 clamp(120px, 26vw, 240px)/.95 var(--font-display); background:linear-gradient(180deg, #fffbe6 10%, #ffd35c 55%, #f39b3a 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 6px 0 rgba(150,40,90,.35)) drop-shadow(0 18px 30px rgba(80,20,60,.25)); animation:bigIn 1s 1.4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes bigIn{from{transform:scale(0) rotate(-20deg); opacity:0}}
.hb-name{font:700 clamp(30px, 5vw, 46px)/1.1 var(--font-hand); color:var(--white); text-shadow:0 3px 14px rgba(80,20,60,.35); animation:fadeUp .8s 2.2s both}
@keyframes fadeUp{from{transform:translateY(16px); opacity:0}}
.bottle{position:absolute; bottom:calc(-46px + env(safe-area-inset-bottom, 0px)); width:clamp(62px, 10vw, 108px); transform-origin:50% 100%}
.bottle.left{left:max(3%, env(safe-area-inset-left, 0px)); transform:rotate(26deg)}
.bottle.right{right:max(3%, env(safe-area-inset-right, 0px)); transform:rotate(-26deg)}
.bottle svg{display:block; width:100%; height:auto; overflow:visible}
.bottle .tip{position:absolute; top:0; left:50%; width:2px; height:2px}
.bottle.shaking svg{animation:bshake .12s linear 7}
@keyframes bshake{50%{transform:translateX(3px) rotate(2deg)}}
.bottle .cork{transition:transform 1.2s cubic-bezier(.15,.8,.3,1), opacity 1.2s}
.bottle.popped .cork{transform:translate(0, -520px) rotate(720deg); opacity:0}
.party-actions{position:absolute; left:0; right:0; bottom:calc(26px + env(safe-area-inset-bottom, 0px)); display:flex; justify-content:center; gap:10px; animation:fadeUp .6s both}
.letter .sheet{background:#fffdf6}
.polas{display:flex; justify-content:center; gap:10px; margin:2px 0 16px; flex-wrap:wrap}
.pola{width:min(30%, 130px); background:var(--white); padding:6px 6px 20px; box-shadow:0 10px 20px -10px rgba(0,0,0,.4); transform:rotate(var(--r))}
.pola img{display:block; width:100%; aspect-ratio:1; object-fit:cover}
.msg p{margin:0 0 12px; font:700 26px/1.2 var(--font-hand); color:var(--ink)}
.msg .sign{text-align:right; color:var(--berry)}
.lrow{display:flex; justify-content:center; gap:8px; margin-top:8px; flex-wrap:wrap}

@media (prefers-reduced-motion: reduce){
  .fp,.drift,.amb{animation:none}
  .party-bg{animation:none}
  .grow,.slide,.petal{transition-duration:.3s}
}
</style>

<div class="bgs" aria-hidden="true">
  <div class="bg on" data-bg="intro"></div>
  <div class="bg" data-bg="garden"></div>
  <div class="bg" data-bg="kitchen"></div>
  <div class="bg" data-bg="box"></div>
  <div class="bg" data-bg="finale"></div>
</div>

<div class="app">
  <header class="hud">
    <ol class="levels" aria-label="Levels">
      <li data-l="1">Garden</li>
      <li data-l="2">Kitchen</li>
      <li data-l="3">The box</li>
    </ol>
    <button id="soundBtn" class="pill-btn" type="button" aria-pressed="true">Sound on</button>
  </header>

  <main class="stage">
    <!-- INTRO -->
    <section id="sc-intro" class="screen active">
      <div class="scene intro">
        <div id="introPetals" aria-hidden="true"></div>
        <div class="intro-in">

function el(tag, attrs, parent){ const e=document.createElementNS(NS, tag); if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
function svgPt(svg, e){ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function svgToScreen(svg, x, y){ const p=svg.createSVGPoint(); p.x=x; p.y=y; const s=p.matrixTransform(svg.getScreenCTM()); return {x:s.x, y:s.y}; }

/* ---------- sound ---------- */
let AC=null, soundOn=true;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } if(AC && AC.state==="suspended") AC.resume(); return AC; }
function tone(f, dur, type, vol, when){ const a=ac(); if(!a||!soundOn) return; dur=dur||.15; vol=vol||.12; const t=a.currentTime+(when||0);
  const o=a.createOscillator(), g=a.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05); }
function noise(dur, vol, freq, when, type){ const a=ac(); if(!a||!soundOn) return; const t=a.currentTime+(when||0);
  const len=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(); s.buffer=buf; const f=a.createBiquadFilter(); f.type=type||"bandpass"; f.frequency.value=freq||1000;
  const g=a.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); }

function birthdaySong(){
  const b=.34, seq=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,2],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2.6]];

}

      b.addEventListener("click", ()=>{ if(o===q.right){ b.classList.add("right"); sfx.chime(); wrap.querySelectorAll("button").forEach(x=>x.disabled=true); body.querySelector(".qmsg").textContent="";
          setTimeout(()=>{ qi++; if(qi<C.quiz.length) render(); else done(); }, 800); }
        else { b.classList.add("wrong"); b.disabled=true; sfx.wrong(); body.querySelector(".qmsg").textContent=pick(WRONG); } }); wrap.appendChild(b); }); };
  render(); }

let puzzleImg=null;
function placeholderArt(){ const c=document.createElement("canvas"); c.width=c.height=600; const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,600); g.addColorStop(0,"#ff9e7a"); g.addColorStop(.5,"#ffd59e"); g.addColorStop(1,"#fff1d6"); x.fillStyle=g; x.fillRect(0,0,600,600);
  x.fillStyle="#fff3b0"; x.beginPath(); x.arc(430,170,72,0,7); x.fill();
  x.fillStyle="#ffffff"; [[140,120,1],[250,200,.7]].forEach(([cx,cy,s])=>{ x.beginPath(); x.arc(cx,cy,30*s,0,7); x.arc(cx+34*s,cy+8*s,24*s,0,7); x.arc(cx-32*s,cy+8*s,22*s,0,7); x.fill(); });
  x.fillStyle="#a9d6b5"; x.beginPath(); x.moveTo(0,380); x.bezierCurveTo(150,320,330,360,600,330); x.lineTo(600,600); x.lineTo(0,600); x.fill();
  x.fillStyle="#6fbf8c"; x.beginPath(); x.moveTo(0,470); x.bezierCurveTo(200,420,400,460,600,430); x.lineTo(600,600); x.lineTo(0,600); x.fill();
  const cols=["#f78fb3","#e2557a","#b9a6ff","#ffffff","#ffcf5c"];
  for(let i=0;i<22;i++){ const fx=20+Math.random()*560, fy=400+Math.random()*180, r=10+Math.random()*12; x.strokeStyle="#4f9a68"; x.lineWidth=3; x.beginPath(); x.moveTo(fx,fy); x.lineTo(fx,fy+40); x.stroke();
    x.fillStyle=pick(cols); for(let k=0;k<6;k++){ const a=k*Math.PI/3; x.beginPath(); x.arc(fx+Math.cos(a)*r*.8, fy+Math.sin(a)*r*.8, r*.55, 0, 7); x.fill(); } x.fillStyle="#ffcf5c"; x.beginPath(); x.arc(fx,fy,r*.4,0,7); x.fill(); }
  return c.toDataURL("image/jpeg",.9); }
function squareCrop(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{ try{ const s=Math.min(im.naturalWidth, im.naturalHeight), c=document.createElement("canvas"); c.width=c.height=600;
      c.getContext("2d").drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,600,600); res(c.toDataURL("image/jpeg",.9)); }catch(e){ res(src); } }; im.onerror=()=>res(placeholderArt()); im.src=src; }); }
function getPuzzleImage(){ if(!puzzleImg) puzzleImg = C.puzzlePhoto ? squareCrop(C.puzzlePhoto) : Promise.resolve(placeholderArt()); return puzzleImg; }
function nbrs(c){ const r=Math.floor(c/3), k=c%3, o=[]; if(r>0) o.push(c-3); if(r<2) o.push(c+3); if(k>0) o.push(c-1); if(k<2) o.push(c+1); return o; }
function buildPuzzle(body, done){
  body.innerHTML=`<p class="hintline">Slide the tiles back into place. Tap a tile next to the empty space.</p><div class="puzzle"><img class="peek" alt="The finished photo"></div><div class="prow"><button class="btn light" type="button" id="peekBtn">Show the photo</button><button class="btn" type="button" id="solveBtn">Solve it for me</button></div>`;
  const wrap=body.querySelector(".puzzle"), peek=body.querySelector(".peek"), tiles=[]; let pos=[0,1,2,3,4,5,6,7,8], solved=false;
  for(let t=0;t<8;t++){ const b=document.createElement("button"); b.type="button"; b.className="tile"; b.setAttribute("aria-label","Puzzle tile");
    b.style.backgroundPosition=`${(t%3)*50}% ${Math.floor(t/3)*50}%`; b.addEventListener("click", ()=>move(t)); wrap.appendChild(b); tiles.push(b); }
  do{ pos=[0,1,2,3,4,5,6,7,8]; let prev=-1; for(let k=0;k<18;k++){ const e=pos[8]; const opts=nbrs(e).filter(c=>c!==prev); const c=pick(opts); const t=pos.slice(0,8).indexOf(c); pos[t]=e; pos[8]=c; prev=e; } }
  while(pos.every((v,i)=>v===i));
  const place=()=>tiles.forEach((b,t)=>{ b.style.left=(pos[t]%3)*33.333+"%"; b.style.top=Math.floor(pos[t]/3)*33.333+"%"; });
  place();
  getPuzzleImage().then(s=>{ peek.src=s; tiles.forEach(b=>b.style.backgroundImage=`url(${s})`); });
  function move(t){ if(solved) return; const c=pos[t], e=pos[8]; if(!nbrs(e).includes(c)){ tiles[t].animate([{transform:"translateX(0)"},{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"translateX(0)"}],{duration:240}); return; }
    pos[t]=e; pos[8]=c; sfx.soft(); place();
    if(pos.every((v,i)=>v===i)) finish(); }
  function finish(){ solved=true; wrap.classList.add("solved"); sfx.win(); body.querySelector(".prow").hidden=true; setTimeout(done, 1500); }
  body.querySelector("#solveBtn").addEventListener("click", ()=>{ if(solved) return; pos=[0,1,2,3,4,5,6,7,8]; place(); sfx.chime(); setTimeout(finish, 350); });
  body.querySelector("#peekBtn").addEventListener("click", e=>{ const on=wrap.classList.toggle("peeking"); e.currentTarget.textContent = on?"Hide the photo":"Show the photo"; });
}
function buildMatch(body, done){
  body.innerHTML=`<p class="hintline">Flip two cards at a time and find the pairs.</p><div class="cards"></div>`;
  const grid=body.querySelector(".cards"); const deck=shuffle(C.pairs.map((p,i)=>({...p,id:i})).concat(C.pairs.map((p,i)=>({...p,id:i}))));
  let open=[], lock=false, matched=0;
  deck.forEach(card=>{ const b=document.createElement("button"); b.type="button"; b.className="card"; b.setAttribute("aria-label","Hidden card");
    b.innerHTML=`<span class="in"><span class="face back">?</span><span class="face front"><b></b><span class="ct"></span></span></span>`;
    b.querySelector(".front b").textContent=card.icon; b.querySelector(".ct").textContent=card.text;
    b.addEventListener("click", ()=>{ if(lock || b.classList.contains("flip")) return; b.classList.add("flip"); b.setAttribute("aria-label", card.text); sfx.soft(); open.push({b,card});
      if(open.length<2) return; lock=true; const [x,y]=open;
      if(x.card.id===y.card.id){ setTimeout(()=>{ x.b.classList.add("matched"); y.b.classList.add("matched"); sfx.chime(); open=[]; lock=false; if(++matched===C.pairs.length){ sfx.win(); setTimeout(done, 900); } }, 380); }
      else setTimeout(()=>{ x.b.classList.remove("flip"); y.b.classList.remove("flip"); x.b.setAttribute("aria-label","Hidden card"); y.b.setAttribute("aria-label","Hidden card"); open=[]; lock=false; }, 900); });
    grid.appendChild(b); }); }
function buildCode(body, done){
  body.innerHTML=`<p class="qtext">Enter the 4 digit code.</p><p class="hintline">Hint: today's date, written as DDMM.</p><div class="slots"><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span></div><div class="keys"></div>`;
  const slots=body.querySelectorAll(".slot"), row=body.querySelector(".slots"), keys=body.querySelector(".keys"); let val="", busy=false;
  const draw=()=>slots.forEach((s,i)=>s.textContent=val[i]||"");
  const press=k=>{ if(busy) return; if(k==="del"){ val=val.slice(0,-1); draw(); return; } if(val.length>=4) return; val+=k; draw(); sfx.tick();
    if(val.length===4){ busy=true; if(val===String(C.code)){ row.classList.add("ok"); sfx.win(); document.removeEventListener("keydown", onKey); setTimeout(done, 900); }
      else { row.classList.add("bad"); sfx.wrong(); setTimeout(()=>{ row.classList.remove("bad"); val=""; draw(); busy=false; }, 550); } } };
  ["1","2","3","4","5","6","7","8","9","del","0"].forEach(k=>{ const b=document.createElement("button"); b.type="button"; b.className="key"; b.textContent=k==="del"?"⌫":k; if(k==="del") b.setAttribute("aria-label","Delete");
    b.addEventListener("click", ()=>press(k)); keys.appendChild(b); });
  const onKey=e=>{ if(!body.isConnected || !body.contains(row)){ document.removeEventListener("keydown", onKey); return; } if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==="Backspace") press("del"); };
  document.addEventListener("keydown", onKey); }

   FINALE

const F = { svg:$("#fsvg"), step:"idle", candles:[], lit:0, down:false };
function buildFinaleCake(){ const holder=$("#fCakeHolder");
  addLinear(F.svg,"fSponge",[["0",C.cake.sponge],["1",C.cake.spongeDark]]); addPetalGrad(F.svg,"fPetalG");
  drawCake(holder,"fSponge",null);
  const cols=["#7fb8ff","#ffffff","#ffd27a","#4f8cff","#a8d8ff"]; const pts=[];
  for(let i=0;i<25;i++){ const a=i*Math.PI*2/25 + .1; pts.push({x:Math.cos(a)*68, y:-136+Math.sin(a)*10, c:cols[i%cols.length]}); }
  pts.sort((p,q)=>p.y-q.y);
  const backG=el("g",{},holder), flowerG=el("g",{},holder), frontG=el("g",{},holder);
  el("path",{d:"M0 -136 C -2 -144 2 -150 0 -158", stroke:"#4f9a68", "stroke-width":"3", fill:"none", "stroke-linecap":"round"}, flowerG);
  el("path",{d:"M0 -144 C -8 -146 -12 -150 -14 -154 C -8 -155 -3 -151 0 -144Z", fill:"#58b07a"}, flowerG);
  const fl=el("g",{transform:"translate(0,-162) scale(.4)"}, flowerG); makeFlower(fl, clamp(C.petalNotes.length,3,8), "fPetalG", false);
  pts.forEach(p=>{ const parent = p.y < -136 ? backG : frontG; const cg=el("g",{transform:`translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`}, parent);
    el("rect",{x:"-2.6", y:"-24", width:"5.2", height:"24", rx:"2", fill:p.c}, cg);
    el("rect",{x:"-2.6", y:"-19", width:"5.2", height:"2.6", fill:"#ffffff", opacity:".6"}, cg); el("rect",{x:"-2.6", y:"-10", width:"5.2", height:"2.6", fill:"#ffffff", opacity:".6"}, cg);
    el("line",{x1:"0", y1:"-24", x2:"0", y2:"-28", stroke:"#3a2f3f", "stroke-width":"1"}, cg);
    const pos=el("g",{transform:"translate(0,-27)"}, cg); const fi=el("g",{class:"grow"}, pos); fi.style.transform="scale(0)"; const fk=el("g",{class:"flick"}, fi); fk.style.animationDelay=(-Math.random())+"s";
    el("circle",{cx:"0", cy:"-6", r:"11", fill:"url(#fFlameGlow)"}, fk); el("path",{d:"M0 -14 C 5 -7 5 -2 0 1 C -5 -2 -5 -7 0 -14Z", fill:"#ffb703"}, fk); el("path",{d:"M0 -9 C 2.5 -5 2.5 -2 0 0 C -2.5 -2 -2.5 -5 0 -9Z", fill:"#fff4c2"}, fk);
    F.candles.push({x:p.x, y:p.y-33, g:cg, fi, lit:false}); }); }
async function goFinale(){ buildFinaleCake(); show("sc-finale","finale"); setLevel(3,true); await sleep(500);
  $("#fCake").style.transform="translateY(0px)"; await sleep(1200);
  for(const c of shuffle(F.candles)){ c.lit=true; c.fi.style.transform="scale(1)"; F.lit++; sfx.tick(); $("#fHalo").style.opacity=String(.9*F.lit/25); await sleep(70); }
  await sleep(500); say("Close your eyes and make a wish.");
  showNext("I made my wish", ()=>{ F.step="blow"; say("Now blow out the candles. Swipe across them, or tap the cake."); }); }
function toLocal(p){ return {x:(p.x-200)/1.3, y:(p.y-436)/1.3}; }
function blowAt(p, r){ if(F.step!=="blow") return; const l=toLocal(p); let n=0;
  F.candles.forEach(c=>{ if(c.lit && Math.hypot(c.x-l.x, (c.y-l.y)*1.4)<r){ c.lit=false; n++; out(c); } });
  if(n){ F.lit-=n; sfx.puff(); $("#fHalo").style.opacity=String(.9*F.lit/25); if(F.lit<=0) lightsOut(); } }
function out(c){ c.fi.style.transform="scale(0)"; const w=el("path",{d:"M0 -28 C -4 -36 4 -42 0 -50 C -4 -58 4 -64 0 -72", stroke:"#d8d2e6", "stroke-width":"1.8", fill:"none", "stroke-linecap":"round", opacity:".7"}, c.g);
  const a=w.animate([{transform:"translateY(0px)", opacity:.7},{transform:"translateY(-26px)", opacity:0}],{duration:1500, easing:"ease-out"}); a.onfinish=()=>w.remove(); }
F.svg.addEventListener("pointerdown", e=>{ if(F.step!=="blow") return; F.down=true; try{ F.svg.setPointerCapture(e.pointerId); }catch(_){} blowAt(svgPt(F.svg,e), 36); });
F.svg.addEventListener("pointermove", e=>{ if(F.step==="blow" && (F.down || e.pointerType==="mouse")) blowAt(svgPt(F.svg,e), 24); });
F.svg.addEventListener("pointerup", ()=>{ F.down=false; });
async function lightsOut(){ F.step="done"; say(""); $("#nextBtn").hidden=true; await sleep(500); $("#blackout").classList.add("on"); await sleep(1700); startParty(); }

const BAL=["#2f6fe0","#4f8cff","#7fb8ff","#a8d8ff","#ffd166","#ffffff","#ffc928"];
let partyOn=false;
function spawnBalloon(delay){ if(!partyOn) return; const c=pick(BAL), size=60+Math.random()*44; const d=document.createElement("button"); d.type="button"; d.className="balloon"; d.setAttribute("aria-label","Pop a balloon");
  d.style.left=(Math.random()*90)+"%"; d.style.width=size+"px"; d.style.setProperty("--dur",(9+Math.random()*6)+"s"); d.style.animationDelay=(delay||0)+"s";
  d.innerHTML=`<span class="sway" style="animation-duration:${(2.4+Math.random()*2).toFixed(2)}s"><svg viewBox="0 0 60 122" aria-hidden="true"><path d="M30 4 C 52 4 58 26 56 40 C 53 60 38 74 30 76 C 22 74 7 60 4 40 C 2 26 8 4 30 4Z" fill="${c}"/><ellipse cx="19" cy="22" rx="6" ry="11" fill="#ffffff" opacity=".45" transform="rotate(-20 19 22)"/><path d="M25 76 L35 76 L30 83Z" fill="${c}"/><path d="M30 83 C 23 93 37 102 30 120" stroke="rgba(255,255,255,.85)" stroke-width="1.4" fill="none"/></svg></span>`;
  d.addEventListener("animationend", e=>{ if(e.animationName==="rise"){ d.remove(); spawnBalloon(0); } });
  d.addEventListener("pointerdown", e=>{ e.preventDefault(); const r=d.getBoundingClientRect(); boom({particleCount:34, spread:80, startVelocity:22, scalar:.8, ticks:110, origin:originAt(r.left+r.width/2, r.top+r.width*.45), colors:[c,"#ffffff"]}); sfx.pop(); d.remove(); setTimeout(()=>spawnBalloon(0), 1200); });
  $("#balloons").appendChild(d); }
function spray(side){ const tip=document.querySelector(`.bottle.${side} .tip`).getBoundingClientRect(); const o=originAt(tip.left, tip.top); const end=Date.now()+1900;
  (function frame(){ boom({particleCount:6, angle: side==="left"?64:116, spread:18, startVelocity:52+Math.random()*16, origin:o, colors:["#ffffff","#fff4c2","#ffe08a","#f7c948"], shapes:["circle"], scalar:.55, gravity:.85, drift: side==="left"?.3:-.3, ticks:230});
    if(Date.now()<end) requestAnimationFrame(frame); })(); }
async function startParty(){ partyOn=true; const p=$("#party");
  const h=$("#hb1"); h.innerHTML=""; [..."Happy Birthday"].forEach((ch,i)=>{ const s=document.createElement("span"); s.className="ch"; s.style.setProperty("--i",i); s.textContent = ch===" " ? " " : ch; h.appendChild(s); });
  $("#hbName").textContent = (C.fullName||C.name) ? (C.fullName||C.name)+"!" : "";
  p.hidden=false; requestAnimationFrame(()=>p.classList.add("on")); await sleep(300); $("#blackout").classList.remove("on");
  for(let i=0;i<14;i++) spawnBalloon(i*.25);
  await sleep(500); document.querySelectorAll(".bottle").forEach(b=>b.classList.add("shaking")); await sleep(900);
  document.querySelectorAll(".bottle").forEach(b=>{ b.classList.remove("shaking"); b.classList.add("popped"); }); sfx.cork(); spray("left"); spray("right");
  boom({particleCount:160, spread:120, startVelocity:48, origin:{x:.5, y:.35}, scalar:1, ticks:220, colors:["#2f6fe0","#7fb8ff","#ffd166","#ffffff","#a8d8ff"]});
  setTimeout(birthdaySong, 900);
  setTimeout(()=>{ boom({particleCount:80, angle:60, spread:60, origin:{x:0, y:.7}}); boom({particleCount:80, angle:120, spread:60, origin:{x:1, y:.7}}); }, 2600);
  await sleep(3200); $("#partyActions").hidden=false;
  setTimeout(()=>{ spray("left"); spray("right"); sfx.whoosh(); }, 3500); }
$("#letterBtn").addEventListener("click", ()=>{ sfx.chime(); const L=$("#letter"), pol=$("#polas"), msg=$("#msg"); pol.innerHTML=""; msg.innerHTML="";
  const photos=(C.photos||[]).slice(0,4); pol.hidden=!photos.length;

  String(C.message).split(/\n\s*\n/).forEach(t=>{ const pEl=document.createElement("p"); pEl.textContent=t.trim(); msg.appendChild(pEl); });
  const sg=document.createElement("p"); sg.className="sign"; sg.textContent="From, "+C.from; msg.appendChild(sg);
